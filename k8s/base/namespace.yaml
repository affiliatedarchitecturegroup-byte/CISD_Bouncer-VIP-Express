apiVersion: v1
kind: Namespace
metadata:
  name: bouncer-vip
  labels:
    name: bouncer-vip
---
apiVersion: v1
kind: Service
metadata:
  name: bouncer-ingress
  namespace: bouncer-vip
spec:
  selector:
    app: traefik
  ports:
  - port: 80
    targetPort: 80
  - port: 443
    targetPort: 443
  type: LoadBalancer