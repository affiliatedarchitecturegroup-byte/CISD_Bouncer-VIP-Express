apiVersion: v1
kind: ConfigMap
metadata:
  name: bouncer-config
  namespace: bouncer-vip
data:
  NODE_ENV: "production"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "bouncer_express"
  POSTGRES_USER: "bouncer"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  NATS_HOST: "nats-service"
  NATS_PORT: "4222"
  LOG_LEVEL: "info"
  PORT: "3000"