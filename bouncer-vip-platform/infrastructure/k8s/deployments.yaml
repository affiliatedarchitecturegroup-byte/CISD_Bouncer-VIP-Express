apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bouncer-vip
  labels:
    app: api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway
    spec:
      containers:
      - name: api-gateway
        image: bouncer-vip/api-gateway:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: bouncer-config
        - secretRef:
            name: bouncer-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bouncer-vip
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-service
  namespace: bouncer-vip
  labels:
    app: crm-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-service
  template:
    metadata:
      labels:
        app: crm-service
        tier: backend
    spec:
      containers:
      - name: crm-service
        image: bouncer-vip/crm-service:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: bouncer-config
        - secretRef:
            name: bouncer-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: bouncer-vip
spec:
  selector:
    app: crm-service
  ports:
  - port: 3001
    targetPort: 3001