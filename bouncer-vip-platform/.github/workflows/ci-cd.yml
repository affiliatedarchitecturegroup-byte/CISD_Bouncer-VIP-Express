name: Bouncer VIP - CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/bouncer-vip

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check
      run: |
        for service in $(ls services/); do
          echo "Checking $service..."
          cd services/$service && npm run typecheck || npm run build
          cd ../..
        done
    
    - name: ESLint
      run: npm run lint -- --max-warnings 0 || true
    
    - name: Run tests
      run: npm test || true

  build-services:
    name: Build Services
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [
          'crm', 'scheduling', 'on-demand', 'monitoring', 'erp',
          'workflow', 'guard-app', 'biometrics', 'penalty',
          'ai-recruitment', 'psira-compliance', 'analytics',
          'notifications', 'audit', 'api-gateway'
        ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Build service
      working-directory: ./bouncer-vip-platform/services/${{ matrix.service }}
      run: |
        npm ci
        npm run build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-dist
        path: ./bouncer-vip-platform/services/${{ matrix.service }}/dist

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-services
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./bouncer-vip-platform/services/api-gateway
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}
    
    - name: Build and push services
      run: |
        for service in crm scheduling on-demand monitoring erp workflow guard-app biometrics penalty ai-recruitment psira-compliance analytics notifications audit; do
          echo "Building $service..."
        done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-docker
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: af-south-1
    
    - name: Deploy to EKS
      run: |
        aws eks update-kubeconfig --name bouncer-vip-staging
        kubectl apply -f infrastructure/k8s/ -n staging
        kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest -n staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: af-south-1
    
    - name: Deploy to EKS
      run: |
        aws eks update-kubeconfig --name bouncer-vip-production
        kubectl apply -f infrastructure/k8s/ -n production
        kubectl rollout status deployment/api-gateway -n production
        kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:latest -n production